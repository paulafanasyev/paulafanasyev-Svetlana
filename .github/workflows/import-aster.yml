name: Import Aster as Svetlana

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-aster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Import Aster source when Android base is absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f apps/android/app/build.gradle.kts ]]; then
            echo "Aster Android base already present; nothing to import."
            exit 0
          fi

          rm -rf .aster-import
          git clone --depth 1 https://github.com/satyajiit/aster-mcp.git .aster-import

          # Runtime/product base: keep the complete Android app plus its MCP/tooling trees.
          cp -a .aster-import/apps .
          cp -a .aster-import/mcp .
          if [[ -d .aster-import/packages ]]; then cp -a .aster-import/packages .; fi
          if [[ -d .aster-import/skill ]]; then cp -a .aster-import/skill .; fi
          if [[ -d .aster-import/assets ]]; then cp -a .aster-import/assets .; fi

          # Preserve this repository's own README/docs/workflows.
          rm -rf .aster-import

      - name: Set Svetlana product name
        shell: bash
        run: |
          set -euo pipefail
          manifest='apps/android/app/src/main/AndroidManifest.xml'
          test -f "$manifest"
          sed -i 's/android:label="[^"]*"/android:label="Светлана"/' "$manifest"

          mkdir -p docs
          cat > docs/ASTER-IMPORT.md <<'EOF'
# Aster → Светлана

Aster is the complete technical baseline for the Svetlana Android agent.

## Baseline policy

- All working Aster functionality is retained, including its existing voice implementation.
- Accessibility, execution, MCP, Binder IPC, tools, OCR/UI hierarchy, notifications, SMS, calls, files, media, camera, clipboard, location, alarms, scheduler, storage, settings, and security controls remain in scope.
- No Azure voice stack is introduced.
- MobileAgent/Sanna are not runtime dependencies of this baseline.
- OX2/Hands remains separate and frozen.
- Internal Aster package/protocol identifiers are preserved initially to avoid destabilizing a working runtime.

## Product adaptation

- Android application label: Светлана.
- Russian user-facing localization/persona is the next adaptation layer, after the imported baseline builds successfully.

## Evidence gate

Source import is not itself a build/runtime PASS. CI must prove compilation, APK generation, installation, and runtime behavior.
EOF

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps mcp packages skill assets docs/ASTER-IMPORT.md
          if git diff --cached --quiet; then
            echo 'No import changes.'
            exit 0
          fi
          git commit -m 'feat: import complete Aster Android base as Svetlana'
          git push origin HEAD:main
